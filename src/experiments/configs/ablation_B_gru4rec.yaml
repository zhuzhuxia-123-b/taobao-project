# 消融 B：GRU4Rec 基线
# 有序列建模（GRU），无图，无对比学习
# 用途：验证"自注意力 vs RNN"的效果差异

model: GRU4Rec
dataset: taobao

# 数据路径
data_path: data_process/processed/

# CPU 专属配置
use_gpu: True
gpu_id: 0
worker: 0

# 数据字段声明
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
TIME_FIELD: timestamp

# 交互文件字段类型
field_separator: "\t"
load_col:
  inter: [user_id, item_id, label, weight, timestamp]

# 序列设置
MAX_ITEM_LIST_LENGTH: 50

# GRU4Rec 参数
hidden_size: 64
num_layers: 2
dropout_prob: 0.1
loss_type: BPR

# 评估设置
eval_args:
  split: {RS: [0.8, 0.1, 0.1]}
  order: TO
  group_by: user
  mode: {valid: uni10, test: uni10}
metrics: [NDCG, Hit,Recall]
topk: [10]
valid_metric: NDCG@10

# 训练设置
epochs: 30
train_batch_size: 1024
eval_batch_size: 128
learning_rate: 0.001
stopping_step: 10

# 日志
log_wandb: False
show_progress: True